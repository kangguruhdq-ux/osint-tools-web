version: "3.8"

services:
  # 1. NEXUS Next.js Web App
  nexus-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-osint-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://nexus_user:nexus_password@postgres:5432/nexus_osint?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=nexus_enterprise_jwt_secret_change_me_in_production_32char_key
      - ENCRYPTION_MASTER_KEY=a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nexus-network

  # 2. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus_osint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_osint"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  # 3. Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexus-network

  # 4. S3-compatible Object Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: nexus-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: nexus_minio_admin
      MINIO_ROOT_PASSWORD: nexus_minio_secret_key_2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
